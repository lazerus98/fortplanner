<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>fortplanner tests</title>
<style>
  :root {
    --ok: #2e7d32; --okbg: #e8f5e9;
    --bad: #c62828; --badbg: #ffebee;
    --ink: #1a1a1a; --muted: #666; --line: #ddd; --bg: #fafafa;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, sans-serif; color: var(--ink); background: var(--bg); }
  header { padding: 16px 20px; border-bottom: 1px solid var(--line); background: #fff; position: sticky; top: 0; }
  h1 { margin: 0 0 4px; font-size: 18px; }
  .sub { color: var(--muted); font-size: 13px; }
  #summary { margin-top: 10px; font-weight: 600; font-size: 15px; padding: 8px 12px; border-radius: 6px; display: inline-block; }
  #summary.pass { background: var(--okbg); color: var(--ok); }
  #summary.fail { background: var(--badbg); color: var(--bad); }
  #summary.run { background: #eef; color: #334; }
  main { padding: 12px 20px 60px; }
  .group { margin: 18px 0 6px; font-weight: 700; font-size: 13px; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); }
  .row { display: flex; gap: 10px; padding: 5px 10px; border-bottom: 1px solid #f0f0f0; align-items: baseline; }
  .tag { font-weight: 700; width: 46px; flex: 0 0 auto; font-size: 12px; }
  .row.ok .tag { color: var(--ok); }
  .row.bad { background: var(--badbg); }
  .row.bad .tag { color: var(--bad); }
  .name { flex: 1; }
  .detail { color: var(--bad); font-family: ui-monospace, monospace; font-size: 12px; white-space: pre-wrap; margin-top: 3px; }
  .banner { margin: 20px; padding: 16px; border: 1px solid var(--bad); background: var(--badbg); border-radius: 8px; color: var(--bad); }
  .banner code { background: #fff; padding: 1px 6px; border-radius: 4px; }
  /* keep the editor laid out but out of the way */
  #app { position: fixed; right: 0; bottom: 0; width: 900px; height: 600px; border: 0; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<header>
  <h1>fortplanner test harness</h1>
  <div class="sub">Loads <code>quickfort-grid-editor.html</code>, drives its real functions, and checks output against what the editor promises. Runs automatically on open.</div>
  <div id="summary" class="run">Running...</div>
</header>
<main id="out"></main>
<iframe id="app" src="quickfort-grid-editor.html"></iframe>

<script>
// ---------- tiny test framework ----------
const results = [];   // {group, name, ok, detail}
let curGroup = '';
let finished = false; // set true once a run renders; drives the watchdog below
function group(g) { curGroup = g; }
function test(name, fn) {
  try { fn(); results.push({ group: curGroup, name, ok: true }); }
  catch (e) { results.push({ group: curGroup, name, ok: false, detail: String(e && e.message || e) }); }
}
function assert(cond, msg) { if (!cond) throw new Error(msg || 'assertion failed'); }
function eq(a, b, msg) {
  if (a !== b) throw new Error((msg ? msg + ': ' : '') + `expected ${JSON.stringify(b)}, got ${JSON.stringify(a)}`);
}
function deepEq(a, b, msg) {
  const sa = JSON.stringify(a), sb = JSON.stringify(b);
  if (sa !== sb) throw new Error((msg ? msg + ': ' : '') + `expected ${sb}, got ${sa}`);
}

// ---------- harness wiring ----------
function expose(win) {
  // Run inside the editor's own global scope so we can grab its lexical
  // bindings (state, Tabs) plus all the top-level function declarations.
  const names = [
    'state','Tabs','makeMatrix','ensureGrids','ensureHistory','getMatrix','setMatrix',
    'setCellValue','setGridSize','tabToMultiZCSV','matrixToCSV',
    'matrixRowsToCSVLines','rotateMatrixCW','mirrorMatrixX','mirrorMatrixY','floodFill',
    'reaimTrackToken','reaimBuildingToken','applyMatTransform',
    'collapseRectangles','containerShorthand','bareDigPriorities','additiveTracks',
    'normalizeImportToken','importSectionToMultiZ','splitStackedZoneTypes',
    'buildModelineText','parseModelineMarkers',
    'parseCSV','csvQuoteLine','firstCSVCell','detectHeaderLine','splitSheetsFromText','splitLogicalRows','headerToTabId',
    'groupSheetsIntoBlueprints','sectionMatrixIsBlank',
    'matrixContentBounds','uniformExportCrop','cropMatrixToBounds',
    'rectCells','lineCells','circleCells','bresenhamLine','pasteBufferAt','copySelectedArea',
    'historyBegin','historyCommit','historyUndo','historyRedo','applyTool','applyToolBatch',
    'mapZ','getHistoryBucket','populatePanelFromToken','buildZoneProps','safeSheetName'
  ];
  const s = win.document.createElement('script');
  s.textContent = 'window.__qf = {' + names.map(n => `${n}:typeof ${n}!=="undefined"?${n}:undefined`).join(',') + '};';
  win.document.body.appendChild(s);
  return win.__qf;
}

function setup(qf, rows = 3, cols = 3, zCount = 1) {
  const st = qf.state;
  st.rows = rows; st.cols = cols; st.zCount = zCount;
  st.activeZ = 0; st.zeroIndex = 0; st.activeTab = 'dig';
  st.preserveZOrder = true;
  st.currentAction = null; st.isUndoRedo = false; st.copyBuffer = null;
  st.selectionRect = null; st.pasteSkipBlanks = false;
  st.mirrorVEnabled = false; st.mirrorHEnabled = false;
  st.grids = {}; st.history = {};
  qf.ensureGrids(); qf.ensureHistory();
}

// Show a prominent message above the results (errors, how-to-run hints).
function banner(html) {
  const b = document.createElement('div');
  b.className = 'banner';
  b.innerHTML = html;
  document.body.insertBefore(b, document.getElementById('out'));
}
function setStatus(text, cls) {
  const s = document.getElementById('summary');
  if (s) { s.className = cls || 'run'; s.textContent = text; }
}

function run(win) {
  finished = true; // we reached the runner; stop the watchdog
  let qf;
  try {
    qf = expose(win);
    if (!qf || typeof qf.tabToMultiZCSV !== 'function') throw new Error('internals not reachable');
  } catch (e) {
    setStatus('Could not reach the editor', 'fail');
    banner('Could not reach the editor across the iframe (this happens on <code>file://</code> in Chrome/Firefox).<br><br>' +
      'Serve the folder over HTTP and reload:<br><br>' +
      '<code>cd fortplanner</code><br><code>python -m http.server 8000</code><br><br>' +
      'then open <code>http://localhost:8000/tests.html</code>.<br><br>Detail: ' + String(e && e.message || e));
    return;
  }
  setStatus('Editor loaded, running tests...');
  try {
    defineTests(qf, win);
  } catch (e) {
    // A throw OUTSIDE a test() (e.g. in setup) used to silently halt the whole
    // run with no output. Surface it, then render whatever did run.
    banner('A test threw while being set up, which stops the run early. Fix this first.<br><br>Detail: ' + String(e && e.message || e));
  }
  render();
}

// ---------- the tests ----------
function defineTests(qf, win) {

  group('CSV: low-level encoding');
  test('matrixToCSV joins rows + header', () => {
    eq(qf.matrixToCSV([['a','b'],['c','d']], '#dig'), '#dig\na,b\nc,d');
  });
  test('matrixToCSV quotes cells containing commas', () => {
    eq(qf.matrixToCSV([['a,b','c']], '#dig'), '#dig\n"a,b",c');
  });
  test('matrixToCSV doubles embedded quotes (RFC 4180)', () => {
    eq(qf.matrixToCSV([['a"b']], '#dig'), '#dig\n"a""b"');
  });
  test('matrixToCSV renders empty/null cells as blank, not "null"', () => {
    eq(qf.matrixToCSV([['', null, undefined]], '#dig'), '#dig\n,,');
  });
  test('matrixRowsToCSVLines emits no header', () => {
    deepEq(qf.matrixRowsToCSVLines([['x',''],['','y']]), ['x,', ',y']);
  });

  group('CSV: blueprint headers');
  // #query was retired from the editor (the tab and its export were dropped), so it is no longer here.
  const headers = { dig:'#dig', build:'#build', place:'#place', zone:'#zone', burrow:'#burrow' };
  Object.entries(headers).forEach(([tab, hdr]) => {
    test(`${tab} tab exports the ${hdr} header`, () => {
      setup(qf, 2, 2, 1);
      qf.state.preserveZOrder = false;
      const csv = qf.tabToMultiZCSV(tab);
      eq(csv.split('\n')[0], hdr);
    });
  });

  group('CSV: cell content round-trips');
  test('a designation token survives export verbatim', () => {
    setup(qf, 3, 3, 1);
    qf.state.preserveZOrder = false;
    qf.setCellValue('dig', 0, 0, 0, 'd');
    qf.setCellValue('dig', 0, 1, 1, 'd');
    const csv = qf.tabToMultiZCSV('dig');
    eq(csv, '#dig\nd,,\n,d,\n,,');
  });
  test('a comma-bearing token is quoted on export', () => {
    setup(qf, 1, 2, 1);
    qf.state.preserveZOrder = false;
    qf.setCellValue('build', 0, 0, 0, 'b,mason'); // contrived token with comma
    const csv = qf.tabToMultiZCSV('build');
    assert(csv.includes('"b,mason"'), 'comma token should be quoted: ' + csv);
  });

  group('CSV: multi-z layers');
  test('two non-empty layers are joined by #>', () => {
    setup(qf, 2, 2, 2);
    qf.state.preserveZOrder = false;
    qf.setCellValue('dig', 0, 0, 0, 'd'); // display layer 0 (top)
    qf.setCellValue('dig', 1, 0, 0, 'd'); // display layer 1 (below)
    const csv = qf.tabToMultiZCSV('dig');
    eq((csv.match(/#>/g) || []).length, 1, '#> count');
  });
  test('preserve mode writes #0N origin metadata', () => {
    setup(qf, 2, 2, 3);
    qf.state.preserveZOrder = true;
    qf.state.zeroIndex = 1;
    qf.setCellValue('dig', 0, 0, 0, 'd');
    const csv = qf.tabToMultiZCSV('dig');
    eq(csv.split('\n')[1], '#01', 'origin line');
    eq((csv.match(/#>/g) || []).length, 2, '#> count for 3 layers');
  });
  test('default mode trims empty top/bottom layers', () => {
    setup(qf, 2, 2, 3);
    qf.state.preserveZOrder = false;
    qf.setCellValue('dig', 1, 0, 0, 'd'); // only the middle layer has content
    const csv = qf.tabToMultiZCSV('dig');
    eq((csv.match(/#>/g) || []).length, 0, 'trimmed to a single layer');
    assert(csv.includes('d'), 'content kept');
  });
  test('all-empty multi-z tab exports without error', () => {
    setup(qf, 2, 2, 2);
    qf.state.preserveZOrder = false;
    const csv = qf.tabToMultiZCSV('dig');
    eq(csv.split('\n')[0], '#dig');
    eq((csv.match(/#>/g) || []).length, 0);
  });

  group('CSV: real export buttons');
  test('Download CSV button exports the active tab via tabToMultiZCSV', () => {
    setup(qf, 2, 2, 1);
    qf.state.preserveZOrder = false;
    qf.state.activeTab = 'build';
    qf.setCellValue('build', 0, 0, 0, 'b');
    let captured = null;
    const orig = win.download;
    win.download = (fn, text) => { captured = { fn, text }; };
    try { win.document.getElementById('downloadcsv').click(); } finally { win.download = orig; }
    assert(captured, 'download was not called');
    // Download filenames are now prefixed with the active blueprint name (e.g. "Blueprint 1-build.csv").
    assert(captured.fn.endsWith('-build.csv'), 'download filename should end with -build.csv, got ' + captured.fn);
    eq(captured.text, qf.tabToMultiZCSV('build'));
  });
  test('Export All bundles every tab, separated by blank lines', () => {
    setup(qf, 2, 2, 1);
    qf.state.preserveZOrder = false;
    let captured = null;
    const orig = win.download;
    win.download = (fn, text) => { captured = { fn, text }; };
    try { win.document.getElementById('exportall').click(); } finally { win.download = orig; }
    assert(captured, 'download was not called');
    // Export All is now named from the workbook (e.g. "Blueprints.csv"), not a fixed string.
    assert(/\.csv$/.test(captured.fn), 'Export All filename should be a .csv, got ' + captured.fn);
    qf.Tabs.forEach(t => assert(captured.text.includes(t.header), 'missing ' + t.header));
    eq((captured.text.match(/\n\n/g) || []).length, qf.Tabs.length - 1, 'blank-line separators');
  });
  test('Copy CSV button copies the active tab CSV', () => {
    setup(qf, 2, 2, 1);
    qf.state.preserveZOrder = false;
    qf.setCellValue('dig', 0, 0, 0, 'd');
    let copied = null;
    const orig = win.copyToClipboard;
    win.copyToClipboard = (text) => { copied = text; };
    try { win.document.getElementById('copycsv').click(); } finally { win.copyToClipboard = orig; }
    eq(copied, qf.tabToMultiZCSV('dig'));
  });

  // The CSV IMPORT-parse layer (parseCSV + csvQuoteLine + firstCSVCell + detectHeaderLine +
  // splitSheetsFromText + headerToTabId) was the one CSV module with ZERO coverage even though its
  // export counterparts (matrixToCSV / matrixRowsToCSVLines) are pinned above. It is the exact inverse
  // of the encoder, so the property that actually matters for a "stop fighting CSVs" tool is
  // parse(encode(x)) === x, and this layer is where the real comma/quote truncation bug shipped
  // (unquoted note/meta lines split on the first comma). Pure, no DOM. Source at
  // quickfort-grid-editor.html:6017-6112 and csvQuoteLine at :4304.
  group('CSV: parse + import round-trip');
  test('parseCSV splits a plain grid into a matrix', () => {
    deepEq(qf.parseCSV('a,b\nc,d'), [['a','b'],['c','d']]);
  });
  test('parseCSV unquotes a quoted comma cell and collapses doubled quotes', () => {
    deepEq(qf.parseCSV('"a,b",c'), [['a,b','c']]);
    deepEq(qf.parseCSV('"a""b"'), [['a"b']]);
  });
  test('parseCSV pads short rows out to a rectangle', () => {
    deepEq(qf.parseCSV('a,b,c\nd'), [['a','b','c'],['d','','']]);
  });
  test('parseCSV normalizes CRLF and a lone CR to row breaks', () => {
    deepEq(qf.parseCSV('a,b\r\nc,d'), [['a','b'],['c','d']]);
    deepEq(qf.parseCSV('x\ry'), [['x'],['y']]);
  });
  test('parseCSV is the exact inverse of matrixRowsToCSVLines (comma + quote cells)', () => {
    const m = [['a,b','c"d'],['','plain']];
    deepEq(qf.parseCSV(qf.matrixRowsToCSVLines(m).join('\n')), m);
  });
  test('csvQuoteLine + firstCSVCell round-trip a comma-bearing note/meta line (shipped bug)', () => {
    // The truncation bug: an unquoted `repeat(down, 3)` note split on the first comma on re-import.
    const note = 'repeat(down, 3)';
    eq(qf.firstCSVCell(qf.csvQuoteLine(note)), note);
    eq(qf.csvQuoteLine('plainlabel'), 'plainlabel'); // safe line stays unquoted (byte-unchanged)
  });
  test('firstCSVCell returns the trimmed first field, quoted or not', () => {
    eq(qf.firstCSVCell('#dig , x'), '#dig');
    eq(qf.firstCSVCell('"a,b",c'), 'a,b');
  });
  test('detectHeaderLine recognizes mode + non-grid headers (case-insensitive), rejects a grid row', () => {
    eq(qf.detectHeaderLine('#dig'), '#dig');
    eq(qf.detectHeaderLine('#zone label(Pasture)'), '#zone'); // markers after the header are ignored
    eq(qf.detectHeaderLine('#Notes'), '#notes');              // case-insensitive
    eq(qf.detectHeaderLine('d,d,d'), null);
    eq(qf.detectHeaderLine(''), null);
  });
  test('headerToTabId maps live headers, skips retired/unknown sections', () => {
    eq(qf.headerToTabId('#dig'), 'dig');
    eq(qf.headerToTabId('#zone'), 'zone');
    eq(qf.headerToTabId('#query'), null); // retired legacy tab: never leaks into another tab
    eq(qf.headerToTabId('#meta'), null);  // non-grid section
  });
  test('splitSheetsFromText splits a two-section bundle, trimming the blank separator', () => {
    const sheets = qf.splitSheetsFromText('#dig\nd,d\n\n#build\nb,\n,b');
    eq(sheets.length, 2);
    eq(sheets[0].header, '#dig');
    deepEq(sheets[0].matrix, [['d','d']]);
    eq(sheets[1].header, '#build');
    deepEq(sheets[1].matrix, [['b',''],['','b']]);
  });
  test('splitSheetsFromText returns one header-less sheet for a bare grid', () => {
    const one = qf.splitSheetsFromText('d,d\n,d');
    eq(one.length, 1);
    eq(one[0].header, null);
    deepEq(one[0].matrix, [['d','d'],['','d']]);
  });
  test('splitSheetsFromText captures the header line modeline (start marker)', () => {
    const hdr = qf.buildModelineText('dig', { startX:'3', startY:'2' }); // '#dig start(3; 2)'
    const s = qf.splitSheetsFromText(hdr + '\nd,d');
    eq(s.length, 1);
    eq(s[0].header, '#dig');
    eq(s[0].modeline.startX, '3');
    eq(s[0].modeline.startY, '2');
  });
  test('splitLogicalRows matches plain split("\\n") when no field spans a newline', () => {
    deepEq(qf.splitLogicalRows('a,b\nc,d'), ['a,b', 'c,d']);
    deepEq(qf.splitLogicalRows('a,b\n'), ['a,b', '']); // trailing separator still yields a final blank row
    deepEq(qf.splitLogicalRows(''), ['']);
  });
  test('splitLogicalRows keeps a quoted embedded newline inside one logical row (spec: message() "supports embedded newlines, quote the cell")', () => {
    // Two physical lines, one logical row: the newline lives inside the quotes.
    const text = '#dig message("Hello\nWorld")\nd,d';
    const rows = qf.splitLogicalRows(text);
    eq(rows.length, 2); // NOT 3: a naive split('\n') would tear the quoted cell into two rows
    eq(rows[0], '#dig message("Hello\nWorld")');
    eq(rows[1], 'd,d');
  });
  test('splitSheetsFromText imports a modeline message() with a real embedded newline without truncating it or spawning a bogus grid row', () => {
    const text = '#dig message("Hello\nWorld")\nd,d';
    const sheets = qf.splitSheetsFromText(text);
    eq(sheets.length, 1);
    eq(sheets[0].header, '#dig');
    eq(sheets[0].modeline.message, 'Hello\nWorld'); // full text kept, not truncated at the embedded newline
    deepEq(sheets[0].matrix, [['d', 'd']]); // the grid body is NOT polluted with a stray '"World")' row
  });
  test('sectionMatrixIsBlank recognizes an all-empty matrix vs one with real content', () => {
    eq(qf.sectionMatrixIsBlank([['']]), true);
    eq(qf.sectionMatrixIsBlank([['', ''], ['', '']]), true);
    eq(qf.sectionMatrixIsBlank([]), true);
    eq(qf.sectionMatrixIsBlank([['', 'd']]), false);
  });
  test('groupSheetsIntoBlueprints gives a wholly-empty blueprint placeholder (bare header, no rows) its own group instead of merging it into a neighbour (shipped bug)', () => {
    // Mirrors blueprintSnapshotToCSV's export of an empty blueprint: a bare '#dig' header
    // with no #0N/rows, sandwiched between two real, disjoint-tab blueprints. Before the
    // fix, the empty marker's 'dig' tab wasn't yet "used" by the preceding #build section,
    // so it silently merged into that group instead of starting its own, and the workbook
    // lost a blueprint on reimport.
    const sheets = [
      { header: '#build', matrix: [['b', '']] },
      { header: '#dig', matrix: [['']] },
      { header: '#dig', matrix: [['#00'], ['d', 'd']] },
    ];
    const groups = qf.groupSheetsIntoBlueprints(sheets);
    eq(groups.length, 3);
    eq(groups[0].length, 1); eq(groups[0][0].header, '#build');
    eq(groups[1].length, 1); eq(groups[1][0].header, '#dig');
    eq(groups[2].length, 1); eq(groups[2][0].header, '#dig');
  });
  test('groupSheetsIntoBlueprints still merges a real repeated tab into a new group (unchanged)', () => {
    const sheets = [
      { header: '#dig', matrix: [['d', 'd']] },
      { header: '#dig', matrix: [['d', 'd']] },
    ];
    const groups = qf.groupSheetsIntoBlueprints(sheets);
    eq(groups.length, 2);
  });

  // The export-side normalisation transforms (container shorthand, dig-priority
  // shorthand, rectangle collapse) and their import-side inverse shipped across many
  // cycles logging "logic read-through only (no browser)". They are pure and
  // table-driven, and the harness had NO import/round-trip coverage, so pin them here.
  group('Export transforms: shorthand + collapse');
  test('containerShorthand collapses a natural-container pile to typeN', () => {
    deepEq(qf.containerShorthand([['f{barrels=5}','s{wheelbarrows=2}','e{bins=3}']]),
           [['f5','s2','e3']]);
  });
  test('containerShorthand keys the count off the LAST type letter', () => {
    // se{bins=5}: last letter e -> bins matches -> collapses.
    deepEq(qf.containerShorthand([['se{bins=5}']]), [['se5']]);
    // fs{barrels=5}: last letter s -> wheelbarrows != barrels, so `fs5` would misattach; leave it.
    deepEq(qf.containerShorthand([['fs{barrels=5}']]), [['fs{barrels=5}']]);
  });
  test('containerShorthand maps a containerless type to wheelbarrows', () => {
    deepEq(qf.containerShorthand([['a{wheelbarrows=5}']]), [['a5']]);
  });
  test('bareDigPriorities strips d1..d7 to a bare 1..7 and leaves d/dx alone', () => {
    deepEq(qf.bareDigPriorities([['d1','d7','d','dx']]), [['1','7','d','dx']]);
  });
  test('collapseRectangles folds a solid block into token(WxH)', () => {
    deepEq(qf.collapseRectangles([['d','d'],['d','d']]), [['d(2x2)',''],['','']]);
  });
  test('collapseRectangles leaves a non-rectangular (L) region tile-by-tile', () => {
    deepEq(qf.collapseRectangles([['d','d'],['d','']]), [['d','d'],['d','']]);
  });
  test('collapseRectangles leaves a lone cell alone (no 1x1 noise)', () => {
    deepEq(qf.collapseRectangles([['d','']]), [['d','']]);
  });

  // safeSheetName dedupes xlsx sheet names. Excel treats sheet names as unique
  // CASE-INSENSITIVELY, so "Farm"/"farm" must be disambiguated or the workbook opens corrupt.
  group('Export: xlsx sheet-name dedupe');
  test('safeSheetName disambiguates a case-insensitive collision', () => {
    const used = new Set();
    eq(qf.safeSheetName('Farm', used), 'Farm');   // first keeps its casing
    eq(qf.safeSheetName('farm', used), 'farm_2');  // case-only dup gets a suffix
    eq(qf.safeSheetName('FARM', used), 'FARM_3');  // and the next, still case-insensitively unique
  });
  test('safeSheetName leaves genuinely-distinct names byte-unchanged', () => {
    const used = new Set();
    eq(qf.safeSheetName('Bedrooms', used), 'Bedrooms');
    eq(qf.safeSheetName('Workshops', used), 'Workshops');
  });
  test('safeSheetName sanitizes illegal chars and clamps to 31', () => {
    const used = new Set();
    eq(qf.safeSheetName('a/b:c*d', used), 'a_b_c_d');
    eq(qf.safeSheetName('x'.repeat(40), used), 'x'.repeat(31));
  });

  // additiveTracks collapses a STRAIGHT carved-track run (the alias caps trackE..trackW
  // horizontally, trackS..trackN vertically) into one additive segment T(Lx1)/T(1xL),
  // clearing the consumed cells. A run missing an end cap, an isolated cap, or a corner
  // mid-run must stay tile-by-tile (only complete straight runs collapse). Dense two-pass
  // geometry with a used-cell overlap guard, and the last export transform still untested.
  group('Export transforms: additive carved tracks');
  test('collapses a horizontal trackE..trackEW..trackW run into T(Lx1)', () => {
    deepEq(qf.additiveTracks([['trackE','trackEW','trackW']]), [['T(3x1)','','']]);
  });
  test('collapses a two-cell horizontal run (no middle) into T(2x1)', () => {
    deepEq(qf.additiveTracks([['trackE','trackW']]), [['T(2x1)','']]);
  });
  test('collapses a vertical trackS..trackNS..trackN run into T(1xL)', () => {
    deepEq(qf.additiveTracks([['trackS'],['trackNS'],['trackN']]),
           [['T(1x3)'],[''],['']]);
  });
  test('leaves a run missing its end cap tile-by-tile', () => {
    // trackE, trackEW, trackEW with no closing trackW: not a complete straight run.
    deepEq(qf.additiveTracks([['trackE','trackEW','trackEW']]),
           [['trackE','trackEW','trackEW']]);
  });
  test('leaves an isolated cap and non-track cells untouched', () => {
    deepEq(qf.additiveTracks([['trackE','d']]), [['trackE','d']]);
  });
  test('collapses a horizontal and a vertical run in one matrix independently', () => {
    deepEq(qf.additiveTracks([['trackS','trackE','trackW'],
                              ['trackN','','']]),
           [['T(1x2)','T(2x1)',''],['','','']]);
  });

  group('Import: normalization + round-trip');
  test('normalizeImportToken expands a bare dig priority, leaves other dig tokens', () => {
    eq(qf.normalizeImportToken('dig','3'), 'd3');
    eq(qf.normalizeImportToken('dig','d'), 'd');
  });
  test('normalizeImportToken expands place container shorthand off the last letter', () => {
    eq(qf.normalizeImportToken('place','f5'), 'f{barrels=5}');
    eq(qf.normalizeImportToken('place','a5'), 'a{wheelbarrows=5}');
    eq(qf.normalizeImportToken('place','se5'), 'se{bins=5}');
  });
  test('normalizeImportToken is the exact inverse of containerShorthand', () => {
    const original = [['f{barrels=5}','s{wheelbarrows=2}','se{bins=5}','a{wheelbarrows=9}']];
    const shrunk = qf.containerShorthand(original);
    const restored = shrunk.map(row => row.map(c => qf.normalizeImportToken('place', c)));
    deepEq(restored, original);
  });
  test('normalizeImportToken inverts bareDigPriorities', () => {
    const original = [['d1','d7','d']];
    const bare = qf.bareDigPriorities(original);
    const restored = bare.map(row => row.map(c => qf.normalizeImportToken('dig', c)));
    deepEq(restored, original);
  });
  test('importSectionToMultiZ expands an area token into a solid block', () => {
    setup(qf, 3, 3, 1);
    qf.state.preserveZOrder = true;
    qf.importSectionToMultiZ('dig', [['d(3x3)']]);
    eq(qf.getMatrix('dig', 0).flat().every(v => v === 'd'), true);
  });
  test('collapseRectangles -> importSectionToMultiZ round-trips a solid block', () => {
    setup(qf, 2, 2, 1);
    qf.state.preserveZOrder = true;
    qf.importSectionToMultiZ('dig', qf.collapseRectangles([['d','d'],['d','d']]));
    deepEq(qf.getMatrix('dig', 0), [['d','d'],['d','d']]);
  });
  // Regression: a solid generic-`T` (carve track) block with BOTH dims > 1 must NOT collapse to
  // `T(WxH)` on the dig tab, because the #dig importer reads that form as an L-shaped carved-track
  // CORNER (two arms only), so a collapsed 3x3 block would re-import as an L of 5 cells.
  test('collapseRectangles leaves a solid dig T block (both dims>1) tile-by-tile', () => {
    deepEq(qf.collapseRectangles([['T','T'],['T','T']], 'dig'), [['T','T'],['T','T']]);
  });
  test('collapseRectangles still folds a straight dig T run (one dim=1) to T(Nx1)', () => {
    deepEq(qf.collapseRectangles([['T','T','T']], 'dig'), [['T(3x1)','','']]);
  });
  test('collapseRectangles still folds a solid T block on a NON-dig tab (no corner ambiguity)', () => {
    deepEq(qf.collapseRectangles([['T','T'],['T','T']], 'build'), [['T(2x2)',''],['','']]);
  });
  test('collapseRectangles -> importSectionToMultiZ round-trips a solid dig T block', () => {
    setup(qf, 3, 3, 1);
    qf.state.preserveZOrder = true;
    qf.importSectionToMultiZ('dig', qf.collapseRectangles(
      [['T','T','T'],['T','T','T'],['T','T','T']], 'dig'));
    eq(qf.getMatrix('dig', 0).flat().every(v => v === 'T'), true);
  });

  // In #dig a bare `T(WxH)` with |W|>1 AND |H|>1 is an L-shaped carved-track CORNER, NOT a
  // solid block (ref doc sec 8 / docs/_reference/corner-track-syntax.md). The importer paints
  // the two arms (length |W| horizontally + |H| vertically from the anchor) as generic `T`, the
  // sign of each dim choosing the corner. This is dense geometry with a real bug history: the
  // generic `(WxH)` expansion once solid-filled `T(3x3)` (carving 4 interior tiles the author
  // never wrote) and the negative-dim corners (`T(-3x-3)` etc.) fell through as literal
  // unrecognized text. Straight `T(1xN)`/`T(Nx1)`, track ALIASES (`trackNSEW(...)`, lowercase
  // so the capital-T regex skips them), and a `#build` `T(3x3)` must all still solid-fill.
  // Pure + deterministic + browser-untested when shipped, so pin the geometry here.
  group('Import: carved-track corner geometry');
  function importCorner(rows, gr = 3, gc = 3, tab = 'dig') {
    setup(qf, gr, gc, 1);
    qf.state.preserveZOrder = true;
    qf.importSectionToMultiZ(tab, rows);
    return qf.getMatrix(tab, 0);
  }
  test('T(3x3) top-left paints an L, not a solid block (interior stays empty)', () => {
    deepEq(importCorner([['T(3x3)']]),
           [['T','T','T'],['T','',''],['T','','']]);
  });
  test('T(-3x3) is the top-right corner (arm runs left + down)', () => {
    // Anchor the token in the top-right cell so both signed arms stay on the grid.
    deepEq(importCorner([['','','T(-3x3)']]),
           [['T','T','T'],['','','T'],['','','T']]);
  });
  test('T(3x-3) is the bottom-left corner (arm runs right + up)', () => {
    deepEq(importCorner([['','',''],['','',''],['T(3x-3)']]),
           [['T','',''],['T','',''],['T','T','T']]);
  });
  test('T(-3x-3) is the bottom-right corner (arm runs left + up)', () => {
    deepEq(importCorner([['','',''],['','',''],['','','T(-3x-3)']]),
           [['','','T'],['','','T'],['T','T','T']]);
  });
  test('an arm running off-grid is clamped per tile, never throws', () => {
    // T(-3x-3) anchored top-left points both arms off the top/left edge; only the anchor lands.
    deepEq(importCorner([['T(-3x-3)']]),
           [['T','',''],['','',''],['','','']]);
  });
  test('a one-wide T(3x1)/T(1x3) is a straight run, NOT an L (falls through to expansion)', () => {
    deepEq(importCorner([['T(3x1)']]), [['T','T','T'],['','',''],['','','']]);
    deepEq(importCorner([['T(1x3)']]), [['T','',''],['T','',''],['T','','']]);
  });
  test('a track ALIAS (WxH) still solid-fills (lowercase t skips the corner branch)', () => {
    deepEq(importCorner([['trackNSEW(2x2)']], 2, 2),
           [['trackNSEW','trackNSEW'],['trackNSEW','trackNSEW']]);
  });
  test('#build T(3x3) still solid-fills (corner branch is dig-only, no trap regression)', () => {
    // The center cell being filled proves it is a solid block, not a hollow L.
    deepEq(importCorner([['T(3x3)']], 3, 3, 'build'),
           [['T','T','T'],['T','T','T'],['T','T','T']]);
  });

  // splitStackedZoneTypes detects overlapping-zone cells (`n{...}t{...}(WxH)`, ref sec 11):
  // it drives the stage-3 display (tooltip names each zone, the "+N" badge, the colour-split
  // background) and must agree with the zone eyedropper reverse-parse on what counts as
  // stacked, or a cell could show a badge yet fail to Alt+click round-trip. Pure + browser-
  // untested when shipped, so pin the grammar here.
  group('Zones: stacked overlap detection');
  test('two overlapping zones return both leading type letters', () => {
    deepEq(qf.splitStackedZoneTypes('n{name="Herd"}t{active=false}'), ['n','t']);
  });
  test('a shared trailing (WxH) extent is allowed after the last zone', () => {
    deepEq(qf.splitStackedZoneTypes('n{name="Herd"}t{active=false}(3x3)'), ['n','t']);
  });
  test('per-zone /label is stripped from the reported type', () => {
    deepEq(qf.splitStackedZoneTypes('n/North{}t{active=false}'), ['n','t']);
  });
  test('a bare second type with no braces still stacks (pen + meeting)', () => {
    deepEq(qf.splitStackedZoneTypes('n{name=Herd}m'), ['n','m']);
  });
  test('a single zone is not stacked (returns [])', () => {
    deepEq(qf.splitStackedZoneTypes('n'), []);
    deepEq(qf.splitStackedZoneTypes('n{name=Herd}'), []);
    deepEq(qf.splitStackedZoneTypes('n{name=Herd}(3x3)'), []);
  });
  test('braceless leading zones split per letter (all #zone types are single letters)', () => {
    // Unlike #place (where combined letters are ONE stockpile), #zone types are each a
    // single letter and Quickfort reads them one at a time, so `nt` is pen + animal
    // training, and `nt{active=false}` (base `n` + overlay `t{...}`, what the #zone-overlay
    // field emits) is two zones, not an unknown "nt". This is the case the greedy [A-Za-z]+
    // regex previously misread as a single type.
    deepEq(qf.splitStackedZoneTypes('nt'), ['n','t']);
    deepEq(qf.splitStackedZoneTypes('nt{active=false}'), ['n','t']);
  });
  test('a malformed token (gap that is not an extent) reports no stack, never corrupts', () => {
    deepEq(qf.splitStackedZoneTypes('n{name=Herd} t{active=false}'), []);
    deepEq(qf.splitStackedZoneTypes(''), []);
    deepEq(qf.splitStackedZoneTypes(null), []);
  });
  test('a quoted prop value containing a literal "}" does not truncate the match', () => {
    // A free-text field (name/location/profession) is JSON.stringify-quoted on compose, which
    // does not escape '}', so a user-typed "Pen}1" legally lands inside the token as name="Pen}1".
    // A naive [^}]* brace-content match would stop at that inner '}' and misread the token.
    deepEq(qf.splitStackedZoneTypes('n{name="Pen}1"}t{active=false}'), ['n','t']);
  });

  // The per-tab modeline header (label/start/hidden/message/comment) is assembled by
  // buildModelineText and read back by parseModelineMarkers on import. This round-trip is
  // pure but had NO coverage, and it has a bug-fix history worth pinning: start() must parse
  // comma / space separators (not only our exported ';'), fields are sanitized so a comma can
  // never split the CSV cell on re-import, and the trim-margins crop must shift start() by the
  // cropped offset (clamped at 1). Each expected value derives from buildModelineText's append
  // order (label, start, hidden(), message(), then the free-text comment) at
  // quickfort-grid-editor.html:4147 and parseModelineMarkers at :4178.
  group('Modeline: marker round-trip');
  test('build emits the bare mode header when there are no markers', () => {
    eq(qf.buildModelineText('dig', null), '#dig');
    eq(qf.parseModelineMarkers('#dig'), null);
  });
  test('a label round-trips through build -> parse', () => {
    const line = qf.buildModelineText('build', { label:'North Herd' });
    eq(line, '#build label(North Herd)');
    eq(qf.parseModelineMarkers(line).label, 'North Herd');
  });
  test('start(X; Y; hint) round-trips', () => {
    const line = qf.buildModelineText('dig', { startX:'10', startY:'5', startHint:'Central stairs' });
    eq(line, '#dig start(10; 5; Central stairs)');
    const p = qf.parseModelineMarkers(line);
    eq(p.startX, '10'); eq(p.startY, '5'); eq(p.startHint, 'Central stairs');
  });
  test('parse accepts semicolon / comma / space start() separators (shipped fix)', () => {
    // Our own export uses ';', but a hand-written or Quickfort-emitted blueprint may use
    // 'start(10, 5)' or 'start(10 5)'. Splitting only on ';' dropped the marker on re-export.
    // The comma form must be a quoted cell: an unquoted comma is a CSV field separator, so
    // firstCSVCell would (correctly) chop the cell at the comma before start() is read.
    const semi = qf.parseModelineMarkers('#dig start(10; 5)');
    const comma = qf.parseModelineMarkers('"#dig start(10, 5)"');
    const space = qf.parseModelineMarkers('#dig start(10 5)');
    eq(semi.startX, '10');  eq(semi.startY, '5');
    eq(comma.startX, '10'); eq(comma.startY, '5');
    eq(space.startX, '10'); eq(space.startY, '5');
  });
  test('hidden() and message() round-trip', () => {
    const h = qf.buildModelineText('dig', { hidden:true });
    eq(h, '#dig hidden()');
    eq(qf.parseModelineMarkers(h).hidden, true);
    const msg = qf.buildModelineText('dig', { message:'Dig this out first' });
    eq(msg, '#dig message(Dig this out first)');
    eq(qf.parseModelineMarkers(msg).message, 'Dig this out first');
  });
  test('every marker round-trips through build -> parse', () => {
    const m = { label:'Dining', startX:'12', startY:'8', startHint:'top left',
                hidden:true, message:'Route to depot', comment:'Grand dining hall' };
    const p = qf.parseModelineMarkers(qf.buildModelineText('dig', m));
    eq(p.label, 'Dining');
    eq(p.startX, '12'); eq(p.startY, '8'); eq(p.startHint, 'top left');
    eq(p.hidden, true);
    eq(p.message, 'Route to depot');
    eq(p.comment, 'Grand dining hall');
  });
  test('CSV-hostile characters in a field are sanitized (keeps re-import lossless)', () => {
    // commas split CSV columns; parens/newlines break the marker grammar. clean() maps them
    // to a space, so 'a, b (c)' -> 'a b c' and the header can never corrupt the CSV on re-import.
    const line = qf.buildModelineText('dig', { label:'a, b (c)' });
    assert(!line.includes(','), 'comma must be stripped so it cannot split the CSV cell: ' + line);
    eq(qf.parseModelineMarkers(line).label, 'a b c');
  });
  test('startShift subtracts the trim crop and clamps X/Y at 1', () => {
    // Trim margins slides the grid origin, so start() must shift by the crop; a coordinate that
    // would go < 1 clamps to 1 (Quickfort cursor is 1-indexed). 10-3=7; 5-9 clamps up to 1.
    eq(qf.buildModelineText('dig', { startX:'10', startY:'5' }, { left:3, top:9 }), '#dig start(7; 1)');
  });

  // The "Trim margins" export crops empty border rows/cols and slides the grid origin, and
  // it must use ONE crop rectangle across a tab's Z-layers so multi-Z floors stay on the same
  // column grid and start() shifts by a single (dLeft,dTop). That geometry
  // (matrixContentBounds -> uniformExportCrop -> cropMatrixToBounds) had the project's worst
  // bug saga (docs/_reference/trim-margins-start-shift.md) yet was browser-untested: the
  // startShift test above pins the offset math but nothing pinned the crop rectangle itself.
  // Each expected value derives from the source at quickfort-grid-editor.html:4071-4114.
  group('Export crop: uniform trim geometry');
  test('matrixContentBounds returns the inclusive box of non-empty cells', () => {
    deepEq(qf.matrixContentBounds([['','',''],['','d',''],['','','']]),
           { rMin:1, rMax:1, cMin:1, cMax:1 });
    deepEq(qf.matrixContentBounds([['d','d'],['d','d']]),
           { rMin:0, rMax:1, cMin:0, cMax:1 });
  });
  test('matrixContentBounds treats whitespace-only cells as empty', () => {
    // cellHas trims, so a cell of spaces is empty and an all-blank matrix has no bounds.
    eq(qf.matrixContentBounds([[' ','']]), null);
    eq(qf.matrixContentBounds([['','']]), null);
  });
  test('uniformExportCrop unions two layers so floors share a column grid', () => {
    // Layer A: content at (1,1). Layer B: content at (0,3). The union spans both.
    const a = [['','','',''],['','d','',''],['','','','']];
    const b = [['','','','d'],['','','',''],['','','','']];
    deepEq(qf.uniformExportCrop([a, b]), { rMin:0, rMax:1, cMin:1, cMax:3 });
  });
  test('uniformExportCrop skips empty layers and is null when all are empty', () => {
    const one = [['','',''],['','d',''],['','','']];
    // an all-empty middle layer must not widen the crop.
    deepEq(qf.uniformExportCrop([one, [['','',''],['','',''],['','','']]]),
           { rMin:1, rMax:1, cMin:1, cMax:1 });
    eq(qf.uniformExportCrop([[['','']], [['']]]), null);
  });
  test('cropMatrixToBounds slices to the inclusive rectangle', () => {
    deepEq(qf.cropMatrixToBounds([['a','b','c'],['d','e','f']], { rMin:0, rMax:1, cMin:1, cMax:2 }),
           [['b','c'],['e','f']]);
  });
  test('cropMatrixToBounds pads cells outside a short/narrow layer with blanks', () => {
    // A one-row layer cropped to a two-row shared box: the missing row becomes blanks so every
    // emitted floor keeps the crop width (empty interior floors crop to blank rows).
    deepEq(qf.cropMatrixToBounds([['a']], { rMin:0, rMax:1, cMin:0, cMax:1 }),
           [['a',''],['','']]);
  });
  test('cropMatrixToBounds with null bounds (all-empty tab) returns the matrix untouched', () => {
    const m = [['a','b'],['c','d']];
    eq(qf.cropMatrixToBounds(m, null), m);
  });
  test('crop to a matrix own bounds equals trimming its empty borders', () => {
    // matrixContentBounds -> cropMatrixToBounds is the single-layer trim: a bordered block
    // crops to just its content, matching the old per-layer trimMatrixMargins result.
    const m = [['','','',''],['','d','e',''],['','f','g',''],['','','','']];
    deepEq(qf.cropMatrixToBounds(m, qf.matrixContentBounds(m)),
           [['d','e'],['f','g']]);
  });

  group('Editing: grid + cells');
  test('setCellValue writes, getMatrix reads back', () => {
    setup(qf, 3, 3, 1);
    qf.setCellValue('dig', 0, 2, 1, 'd');
    eq(qf.getMatrix('dig', 0)[2][1], 'd');
  });
  test('setCellValue ignores out-of-bounds coordinates', () => {
    setup(qf, 3, 3, 1);
    qf.setCellValue('dig', 0, 99, 99, 'd'); // must not throw
    eq(qf.getMatrix('dig', 0).flat().filter(Boolean).length, 0);
  });
  test('resize preserves existing content within overlap', () => {
    setup(qf, 3, 3, 1);
    qf.setCellValue('dig', 0, 0, 0, 'd');
    qf.setGridSize(6, 6);
    const m = qf.getMatrix('dig', 0);
    eq(m.length, 6); eq(m[0].length, 6);
    eq(m[0][0], 'd', 'top-left preserved');
  });

  group('Editing: tool panel');
  // Clicking a palette button only ever set state.selectedToolByTab and refreshed the label;
  // it never reset the property-panel fields, unlike the eyedropper's populatePanelFromToken
  // (which always resyncs every field for the picked token). So a stale filled-in field from
  // a previously selected token (e.g. burrow name/create left over from "add") silently kept
  // getting composed onto a newly selected, unrelated token (e.g. "erase"), with no visual cue
  // since the panel still showed the old values. Covers the fix: switching tokens clears the
  // panel, re-clicking the SAME already-active token does not.
  test('switching burrow tool (add -> erase) clears the stale name/create fields', () => {
    setup(qf);
    qf.state.activeTab = 'burrow';
    win.document.getElementById('burrow-name').value = 'Safe';
    win.document.getElementById('burrow-create').checked = true;
    win.document.querySelector('#burrow-types [data-tool="e"]').click();
    eq(qf.state.selectedToolByTab.burrow, 'e', 'tool switched to erase');
    eq(win.document.getElementById('burrow-name').value, '', 'stale name cleared');
    eq(win.document.getElementById('burrow-create').checked, false, 'stale create cleared');
  });
  test('re-clicking the same already-active burrow tool leaves its fields alone', () => {
    setup(qf);
    qf.state.activeTab = 'burrow';
    win.document.querySelector('#burrow-types [data-tool="a"]').click();
    win.document.getElementById('burrow-name').value = 'Keep';
    win.document.querySelector('#burrow-types [data-tool="a"]').click();
    eq(win.document.getElementById('burrow-name').value, 'Keep', 'field untouched when tool did not change');
  });

  group('Editing: zone reverse-parse');
  // The zone-location <select> only holds its five fixed types (tavern/temple/library/
  // guildhall/hospital); DFHack recognises more (e.g. inn). A token carrying an out-of-list
  // type silently blanked the select, and on repaint buildZoneProps (which emits location only
  // when a type is set) dropped the WHOLE location, name included. The fix routes an
  // unrepresentable type to the extra-props field so it round-trips, mirroring allow/speed.
  test('an out-of-list zone location type round-trips via extra-props instead of vanishing', () => {
    setup(qf);
    qf.state.activeTab = 'zone';
    qf.populatePanelFromToken('zone', 'm{location=inn/mainpub name="Tap Room"}');
    eq(win.document.getElementById('zone-location').value, '', 'select is not set to an unrepresentable type');
    eq(win.document.getElementById('zone-props').value.includes('location=inn/mainpub'), true, 'unknown location routed to extra-props');
    eq(qf.buildZoneProps().includes('location=inn/mainpub'), true, 'location survives a repaint');
  });
  test('an in-list zone location still populates the select and name fields', () => {
    setup(qf);
    qf.state.activeTab = 'zone';
    qf.populatePanelFromToken('zone', 'm{location=temple/grand}');
    eq(win.document.getElementById('zone-location').value, 'temple', 'known type fills the select');
    eq(win.document.getElementById('zone-location-name').value, 'grand', 'label fills the name field');
    eq(win.document.getElementById('zone-props').value.includes('location='), false, 'known location not duplicated into extra-props');
  });
  // unq (reverse-parse) must invert the emit side's JSON.stringify, which escapes BOTH " and \.
  // The old code only undid \", leaving \\ intact, so a name with a literal backslash doubled
  // its backslashes on every eyedropper -> repaint. The token below carries the 3-char name
  // a\b (written a\\b on disk); it must come back as a\b and re-emit single-escaped, unchanged.
  test('a zone name containing a backslash round-trips without doubling', () => {
    setup(qf);
    qf.state.activeTab = 'zone';
    qf.populatePanelFromToken('zone', 'n{name="a\\\\b"}');
    eq(win.document.getElementById('zone-name').value, 'a\\b', 'backslash unescaped to a single backslash');
    eq(qf.buildZoneProps().includes('name="a\\\\b"'), true, 'repaint re-emits the same single-escaped name');
  });

  group('Editing: transforms');
  test('rotateMatrixCW rotates a 3x2 into a 2x3', () => {
    const out = qf.rotateMatrixCW([['a','b'],['c','d'],['e','f']]);
    deepEq(out, [['e','c','a'],['f','d','b']]);
  });
  test('rotateMatrixCW four times is identity', () => {
    const m = [['a','b','c'],['d','e','f']];
    let r = m; for (let i=0;i<4;i++) r = qf.rotateMatrixCW(r);
    deepEq(r, m);
  });
  test('mirrorMatrixX flips rows; applied twice is identity', () => {
    const m = [['a','b'],['c','d'],['e','f']];
    deepEq(qf.mirrorMatrixX(m), [['e','f'],['c','d'],['a','b']]);
    deepEq(qf.mirrorMatrixX(qf.mirrorMatrixX(m)), m);
  });
  test('mirrorMatrixY flips columns; applied twice is identity', () => {
    const m = [['a','b','c'],['d','e','f']];
    deepEq(qf.mirrorMatrixY(m), [['c','b','a'],['f','e','d']]);
    deepEq(qf.mirrorMatrixY(qf.mirrorMatrixY(m)), m);
  });

  // A geometric transform must also re-aim the DIRECTION letters of carved / constructed
  // tracks and direction-sensitive #build buildings (a mirrored trackNE corner is a trackNW,
  // ref doc sec 13). This logic is pure and was shipped browser-untested, so pin it here.
  group('Editing: track re-aim');
  test('carved-track corner re-aims under each transform', () => {
    eq(qf.reaimTrackToken('trackNE', 'my'), 'trackNW', 'mirror Y (left-right)');
    eq(qf.reaimTrackToken('trackNE', 'mx'), 'trackSE', 'mirror X (top-bottom)');
    eq(qf.reaimTrackToken('trackNE', 'rotate'), 'trackSE', 'rotate cw');
    eq(qf.reaimTrackToken('trackNE', 'rotateCCW'), 'trackNW', 'rotate ccw');
  });
  test('straight track re-aims and stays canonically ordered', () => {
    eq(qf.reaimTrackToken('trackNS', 'rotate'), 'trackEW', 'N-S rotate cw -> E-W');
    eq(qf.reaimTrackToken('trackNS', 'my'), 'trackNS', 'N-S mirror Y unchanged');
    // rotate cw sends N->E, S->W; result must re-sort to canonical NSEW order.
    eq(qf.reaimTrackToken('trackEW', 'rotate'), 'trackNS', 'E-W rotate cw -> N-S');
  });
  test('constructed-track ramp prefix is preserved on re-aim', () => {
    eq(qf.reaimTrackToken('trackrampNE', 'rotate'), 'trackrampSE');
  });
  test('a non-track token passes through reaimTrackToken unchanged', () => {
    eq(qf.reaimTrackToken('d', 'rotate'), 'd');
    eq(qf.reaimTrackToken('b', 'my'), 'b');
    eq(qf.reaimTrackToken('', 'rotate'), '');
  });

  group('Editing: building re-aim');
  test('bridge facing re-aims (gw raises N; ref-doc example gw rotate cw = gd)', () => {
    eq(qf.reaimBuildingToken('gw', 'rotate'), 'gd', 'rotate cw');
    eq(qf.reaimBuildingToken('gw', 'mx'), 'gx', 'mirror X');
    eq(qf.reaimBuildingToken('gd', 'my'), 'ga', 'mirror Y');
    eq(qf.reaimBuildingToken('g', 'rotate'), 'g', 'plain retracting bridge unchanged');
  });
  test('screw-pump facing re-aims', () => {
    eq(qf.reaimBuildingToken('Msu', 'rotate'), 'Msk', 'from N -> from E on rotate cw');
    eq(qf.reaimBuildingToken('Msu', 'my'), 'Msu', 'from N unchanged under left-right mirror');
  });
  test('roller / track-stop cardinal letters re-aim', () => {
    eq(qf.reaimBuildingToken('rollerNS', 'rotate'), 'rollerEW');
    eq(qf.reaimBuildingToken('rollerNS', 'mx'), 'rollerSN', 'push order preserved');
    eq(qf.reaimBuildingToken('trackstopE', 'rotate'), 'trackstopS');
    eq(qf.reaimBuildingToken('trackstop', 'rotate'), 'trackstop', 'no-direction stop unchanged');
  });
  test('axle / water-wheel swap axis on rotation but not on mirror', () => {
    eq(qf.reaimBuildingToken('Mh', 'rotate'), 'Mhs', 'E-W axle -> N-S on rotate');
    eq(qf.reaimBuildingToken('Mh', 'mx'), 'Mh', 'mirror does not swap the axis');
    eq(qf.reaimBuildingToken('Mw', 'rotate'), 'Mws', 'vertical wheel -> horizontal on rotate');
    eq(qf.reaimBuildingToken('Mv', 'rotate'), 'Mv', 'vertical axle has no in-plane orientation');
  });
  test('a property tail (/label {props} :config) survives re-aim', () => {
    eq(qf.reaimBuildingToken('rollerNS{speed=50000}', 'rotate'), 'rollerEW{speed=50000}');
    eq(qf.reaimBuildingToken('trackstopE{route=Foo}', 'rotate'), 'trackstopS{route=Foo}');
  });
  test('applyMatTransform moves cells AND re-aims tracks together', () => {
    // trackNE at (0,0), trackNS at (1,1); mirror Y (left-right) swaps columns and re-aims.
    const m = [['trackNE',''],['','trackNS']];
    deepEq(qf.applyMatTransform(m, 'my'), [['','trackNW'],['trackNS','']]);
  });

  group('Editing: shapes');
  test('bresenhamLine traces a straight horizontal run', () => {
    deepEq(qf.bresenhamLine(0,0,0,3), [[0,0],[0,1],[0,2],[0,3]]);
  });
  test('bresenhamLine traces a clean diagonal', () => {
    deepEq(qf.bresenhamLine(0,0,2,2), [[0,0],[1,1],[2,2]]);
  });
  test('rectCells filled covers the whole box', () => {
    setup(qf, 5, 5, 1);
    eq(qf.rectCells(0,0,2,2,false,1).length, 9);
  });
  test('rectCells outline is just the perimeter', () => {
    setup(qf, 5, 5, 1);
    eq(qf.rectCells(0,0,2,2,true,1).length, 8); // 3x3 ring
  });
  test('circleCells with zero radius is a single cell', () => {
    setup(qf, 5, 5, 1);
    deepEq(qf.circleCells(2,2,2,2,false,1), [[2,2]]);
  });
  test('lineCells (thickness 1) matches the bresenham point count', () => {
    setup(qf, 5, 5, 1);
    eq(qf.lineCells(0,0,4,4,1).length, qf.bresenhamLine(0,0,4,4).length);
  });
  test('lineCells honors an EVEN thickness (regression: size 2 painted 1-wide)', () => {
    setup(qf, 5, 5, 1);
    // A single-point line thickened by t paints a t x t block. Even sizes used
    // to collapse to the next-lower odd width (2 -> 1 cell); now 2 -> 2x2 = 4.
    eq(qf.lineCells(2,2,2,2,2).length, 4);
    eq(qf.lineCells(2,2,2,2,3).length, 9); // odd unchanged (3x3)
    eq(qf.lineCells(2,2,2,2,4).length, 16); // 4x4
  });

  group('Editing: flood fill');
  test('flood fill of a blank grid fills every cell', () => {
    setup(qf, 3, 3, 1);
    qf.floodFill(1, 1, 'd');
    eq(qf.getMatrix('dig',0).flat().every(v => v === 'd'), true);
  });
  test('flood fill respects a barrier', () => {
    setup(qf, 3, 3, 1);
    for (let r=0;r<3;r++) qf.setCellValue('dig',0,r,1,'x'); // wall down the middle column
    qf.floodFill(0, 0, 'd'); // fill left region only
    const m = qf.getMatrix('dig',0);
    eq(m[0][0], 'd'); eq(m[1][0], 'd'); eq(m[2][0], 'd');
    eq(m[0][1], 'x', 'barrier untouched');
    eq(m[0][2], '', 'right side untouched');
  });
  test('flood fill with Mirror V enabled fills the whole contiguous region, not just up to its own mirror echo', () => {
    setup(qf, 1, 5, 1);
    qf.state.mirrorVEnabled = true;
    qf.state.mirrorVIndex = 1; // pairs column 0 with column 1
    qf.floodFill(0, 0, 'd');
    const m = qf.getMatrix('dig', 0);
    eq(m[0].every(v => v === 'd'), true, 'the mirrored echo written into column 1 must not look like a wall to the fill\'s own containment check');
  });
  test('floodFill: a mirror axis straddling the flood does not swap which cell is literal vs mirrored', () => {
    setup(qf, 1, 4, 1);
    qf.state.activeTab = 'build';
    qf.state.mirrorVEnabled = true;
    qf.state.mirrorVIndex = 1; // pairs column 0 with column 1
    qf.floodFill(0, 0, 'trackstopE');
    const m = qf.getMatrix('build', 0);
    eq(m[0][0], 'trackstopE', 'column 0 is visited directly by the flood; column 1\'s later direct visit must not echo back and overwrite it');
    eq(m[0][1], 'trackstopE', 'column 1 is visited directly by the flood too, must keep the literal token');
  });
  test('applyToolBatch: a mirror axis straddling a brush/shape stamp does not swap which cell is literal vs mirrored', () => {
    setup(qf, 1, 4, 1);
    qf.state.activeTab = 'build';
    qf.state.mirrorVEnabled = true;
    qf.state.mirrorVIndex = 1; // pairs column 0 with column 1
    qf.applyToolBatch([[0,0],[0,1]], 'trackstopE'); // e.g. a 2-wide brush stamp straddling the axis
    const m = qf.getMatrix('build', 0);
    eq(m[0][0], 'trackstopE', 'column 0 is a direct stamp cell, must keep the literal token, not the other cell\'s mirror echo');
    eq(m[0][1], 'trackstopE', 'column 1 is a direct stamp cell too, must not be overwritten by column 0\'s mirror echo');
  });
  test('applyTool: a shared stroke guard stops a later freehand cell\'s mirror echo from clobbering an earlier cell\'s direct paint', () => {
    setup(qf, 1, 4, 1);
    qf.state.activeTab = 'build';
    qf.state.mirrorVEnabled = true;
    qf.state.mirrorVIndex = 1; // pairs column 0 with column 1
    const guard = new Set();
    qf.applyTool(0, 0, 'trackstopE', guard); // 1st onCellEnter of a freehand drag: direct paint, echoes into column 1
    qf.applyTool(0, 1, 'trackstopE', guard); // 2nd onCellEnter, a SEPARATE call: direct paint of column 1
    const m = qf.getMatrix('build', 0);
    eq(m[0][0], 'trackstopE', 'column 0 was directly painted by the 1st call; the 2nd call\'s echo must not overwrite it');
    eq(m[0][1], 'trackstopE', 'column 1 is a direct paint from the 2nd call');
  });

  group('Editing: undo / redo');
  test('undo restores prior value, redo reapplies it', () => {
    setup(qf, 3, 3, 1);
    qf.historyBegin();
    qf.setCellValue('dig', 0, 1, 1, 'd');
    qf.historyCommit();
    eq(qf.getMatrix('dig',0)[1][1], 'd');
    qf.historyUndo();
    eq(qf.getMatrix('dig',0)[1][1], '', 'undo cleared the cell');
    qf.historyRedo();
    eq(qf.getMatrix('dig',0)[1][1], 'd', 'redo restored the cell');
  });
  // The undo/redo button state + count read the history through getHistoryBucket
  // (which applies mapZ, display->storage index), matching the bucket historyUndo/
  // historyRedo actually mutate. A raw history[tab][activeZ] read diverges on any
  // 2+ Z-level blueprint (mapZ(0) != 0), showing another floor's state. Pins the fix.
  test('active floor history reads through mapZ, not the raw display index (2 Z-levels)', () => {
    setup(qf, 3, 3, 2);
    assert(qf.mapZ(0) === 1, 'mapZ(0) should be 1 for a 2-floor blueprint, got ' + qf.mapZ(0));
    qf.historyBegin();
    qf.setCellValue('dig', qf.state.activeZ, 1, 1, 'd');
    qf.historyCommit();
    eq(qf.getHistoryBucket().idx, 1, 'the accessor the buttons use reports one undoable step');
    // The old buggy read (raw display index) points at the OTHER, untouched floor.
    eq(qf.state.history['dig'][0].idx, 0, 'raw history[tab][activeZ] is the wrong, empty bucket');
  });

  group('Editing: copy / paste');
  test('pasteBufferAt stamps the buffer at a position', () => {
    setup(qf, 3, 3, 1);
    qf.state.copyBuffer = [['a','b'],['c','d']];
    qf.pasteBufferAt(1, 1);
    const m = qf.getMatrix('dig',0);
    eq(m[1][1], 'a'); eq(m[1][2], 'b'); eq(m[2][1], 'c'); eq(m[2][2], 'd');
  });
  test('pasteSkipBlanks leaves existing cells under blank buffer cells', () => {
    setup(qf, 3, 3, 1);
    qf.setCellValue('dig', 0, 0, 1, 'z');
    qf.state.copyBuffer = [['a','']];
    qf.state.pasteSkipBlanks = true;
    qf.pasteBufferAt(0, 0);
    const m = qf.getMatrix('dig',0);
    eq(m[0][0], 'a'); eq(m[0][1], 'z', 'blank buffer cell did not overwrite');
  });
  test('copySelectedArea captures the selected rectangle into copyBuffer', () => {
    setup(qf, 4, 4, 1);
    qf.setCellValue('dig', 0, 1, 1, 'd');
    qf.setCellValue('dig', 0, 1, 2, 'd');
    qf.state.selectionRect = { r0:1, c0:1, r1:2, c1:2, tab:'dig', z:0 };
    qf.copySelectedArea();
    deepEq(qf.state.copyBuffer, [['d','d'],['','']]);
  });
}

// ---------- rendering ----------
function render() {
  const out = document.getElementById('out');
  const groups = [...new Set(results.map(r => r.group))];
  for (const g of groups) {
    const h = document.createElement('div'); h.className = 'group'; h.textContent = g; out.appendChild(h);
    for (const r of results.filter(x => x.group === g)) {
      const row = document.createElement('div'); row.className = 'row ' + (r.ok ? 'ok' : 'bad');
      const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = r.ok ? 'PASS' : 'FAIL';
      const name = document.createElement('div'); name.className = 'name'; name.textContent = r.name;
      if (!r.ok && r.detail) {
        const d = document.createElement('div'); d.className = 'detail'; d.textContent = r.detail; name.appendChild(d);
      }
      row.appendChild(tag); row.appendChild(name); out.appendChild(row);
    }
  }
  const pass = results.filter(r => r.ok).length;
  const fail = results.length - pass;
  const sum = document.getElementById('summary');
  if (sum) {
    sum.className = fail ? 'fail' : 'pass';
    sum.textContent = `${pass}/${results.length} passed` + (fail ? `: ${fail} FAILED` : ': all green');
  }
  console.log(`[fortplanner tests] ${pass}/${results.length} passed` + (fail ? `, ${fail} failed` : ''),
    fail ? results.filter(r => !r.ok) : '');
  // machine-readable handle for headless runners / CI
  window.__testResults = { pass, fail, total: results.length,
    failures: results.filter(r => !r.ok).map(r => ({ name: r.name, detail: r.detail })) };
  document.title = (fail ? `FAIL ${fail}` : 'PASS') + ': fortplanner tests';
}

// ---------- boot ----------
window.addEventListener('load', () => {
  const iframe = document.getElementById('app');
  const start = () => setTimeout(() => {
    try { run(iframe.contentWindow); }
    catch (e) { finished = true; setStatus('Runner error', 'fail'); banner('The test runner itself threw: ' + String(e && e.message || e)); }
  }, 60);
  if (iframe.contentDocument && iframe.contentDocument.readyState === 'complete') start();
  else iframe.addEventListener('load', start);
  // Watchdog: if nothing has run within 12s, say so instead of spinning on "Running..." forever.
  setTimeout(() => {
    if (finished) return;
    setStatus('Did not run (see message above)', 'fail');
    banner('Tests did not start within 12 seconds. The editor iframe probably failed to load or threw during startup.<br><br>' +
      'Open DevTools (F12) and check the Console for the first red error in <code>quickfort-grid-editor.html</code>, then reload.<br><br>' +
      'Make sure you opened this over <code>http://localhost</code>, not as a <code>file://</code> path.');
  }, 12000);
});
</script>
